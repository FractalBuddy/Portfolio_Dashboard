name: Keepalive

# GitHub desactiva los workflows programados de un repo público tras 60 días sin actividad
# (en la práctica, sin commits nuevos). Volver a "habilitar" el workflow por API no está
# documentado como reinicio del contador, y además es circular: si el repo se queda inactivo,
# este mismo workflow se desactiva a la vez que el resto. Por eso aquí se hace actividad real:
# si el último commit de la rama por defecto tiene más de 30 días, se añade un commit mínimo
# (una fecha en .github/keepalive). Con commits normales o merges de Dependabot no hace nada.
# Healthchecks.io (heartbeat de update-data.yml) sigue siendo la red de seguridad real si esto no bastara.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch: {}

# Todo a nivel de job (mínimo privilegio): el workflow en sí no concede nada.
permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    permissions:
      contents: write   # el commit mínimo
      actions: write    # reactivar update-data.yml
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Commit de actividad si hace >30 días del último
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          # Si por lo que sea el evento no trae la rama por defecto, se usa la rama que dejó el checkout.
          BRANCH="${BRANCH:-$(git rev-parse --abbrev-ref HEAD)}"
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "HEAD" ]; then echo "::error::no se pudo determinar la rama por defecto"; exit 1; fi
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Último commit hace ${age_days} días"
          if [ "$age_days" -lt 30 ]; then
            echo "Hay actividad reciente: no hace falta commit."
            exit 0
          fi
          mkdir -p .github
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive (evita desactivación por inactividad)"
          git push origin "HEAD:refs/heads/${BRANCH}"

      - name: Reactivar update-data.yml si estuviera desactivado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update-data.yml/enable" || echo "::warning::no se pudo reactivar update-data.yml"
