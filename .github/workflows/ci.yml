name: CI

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Python syntax
        run: python -m py_compile scripts/fetch_market_data.py scripts/generate_reports.py

      - name: Dependencies resolve
        run: |
          pip install --dry-run -r requirements.txt
          pip install --dry-run -r scripts/requirements-reports.txt

      - name: No personal files committed
        run: |
          bad=$(git ls-files '*.html' '*backup*' '*.env' | grep -v '^README' || true)
          if [ -n "$bad" ]; then echo "::error::Ficheros que no deberían estar en el repo público:"; echo "$bad"; exit 1; fi
