name: Personal full

# Datos PROPIOS del dueño, payload COMPLETO (funds + series con el histórico largo de los proxies), 4 veces al día. La lista a seguir se lee de Supabase y el resultado se
# publica de vuelta con publish_personal_feed; NUNCA en el repo, en un artefacto ni en los logs (los de un repo público son públicos: solo contadores).
# El NAV de iShares con más frecuencia (cada ~60 min, disparador externo, con parada temprana) lo publica personal-nav.yml con la RPC publish_personal_nav; aquí el NAV se vuelve a leer igualmente, así que este
# job funciona SOLO (también antes de que exista esa RPC) y es el que CREA el payload de un usuario nuevo (publish_personal_nav devuelve no_payload hasta entonces).
#
# Frecuencia (AU01-F1): el cron es RESPALDO del disparador externo (workflow_dispatch): 06:38, 13:38 y 21:38 UTC, todos los días. Motivos:
#   * El histórico de los proxies solo cambia al cerrar cada bolsa: 3 fotos al día cubren la apertura europea (06:38, con el cierre de ayer), la tarde europea (13:38) y el cierre
#     de EE. UU. (21:38: Nueva York cierra a las 20:00-21:00 UTC según el horario de verano). Más runs no aportarían series nuevas y cada uno cuesta ~2 peticiones a Yahoo por proxy con `period=max`.
#   * El job (con secretos) solo corre sobre refs/heads/main: un workflow_dispatch con otra rama no ejecuta código viejo con el token.
#   * Todos los días (no solo laborables): un usuario nuevo recibe su payload completo en ≤ 6 h aunque lo añada en fin de semana; en fin de semana solo se repite lo del viernes.
#   * Minuto :38, a propósito: cae a mitad de camino entre los runs de NAV (:23 y :53), a ≥ 15 min de cada uno (el run completo dura ~2 min), y no coincide con update-data (:17) ni con
#     publish-feed-v2 (:47). GitHub retrasa y a veces descarta los cron en :00/:30. Un run descartado o retrasado no importa: el siguiente publica el estado completo.
#
# Relación con personal-nav.yml (NO comparten concurrencia, a propósito):
#   * Los dos escriben el mismo payload de usuario en Supabase: este lo SUSTITUYE entero (publish_personal_feed) y el de NAV fusiona solo `funds` (publish_personal_nav). Si un run de NAV
#     publicase justo entre la lectura de la ficha de este run y su publicación, este run reescribiría ese NAV con el que él leyó unos minutos antes; se corrige solo en el siguiente run de
#     NAV (la RPC de NAV no acepta un NAV con nav_date_iso más antigua que el guardado) y por el desfase de minutos de arriba es muy improbable. Con la parada temprana de NAV
#     (AU01-F1): si el NAV reescrito es anterior al último día hábil esperado, el siguiente run de NAV visita la ficha y lo corrige; si es el esperado (y el pisado era aún más
#     nuevo), se recupera como tarde al día hábil siguiente. No se compensa serializando:
#     con un grupo de concurrencia común GitHub guarda UN solo run pendiente y un run de NAV pendiente descartaría a este (que es el que crea los payloads).
#   * Dos runs de ESTE job nunca se pisan: grupo propio `personal-full`.
#
# Mientras la variable de repo FEED_V2_ENABLED no valga `true` el cron NO hace nada; el lanzamiento manual (Run workflow) funciona siempre.
#
# SOMBRA NAV Yahoo (fase F1 del diseño DISENO_NAV_YAHOO, auditorias/FIXES_NAV_F1_SOMBRA.md): los TRES últimos pasos, DESPUÉS de publicar. Miden si el
# precio de Yahoo (símbolos 0P…, datos de Morningstar) coincide con el NAV oficial de iShares de la MISMA fecha, solo para los fondos con ficha y NAV
# oficial en este run. NO PUBLICA NADA (ni Supabase, ni repo, ni artefactos) y no cambia lo que ve nadie. Sin token ni secretos nuevos: lee lo que ya
# dejaron watch y build en $RUNNER_TEMP/personal. Solo contadores en el log y en el resumen del job. Interruptor y parámetros: config/yahoo_shadow.json
# (enabled true/false, franjas UTC, tope de peticiones...): apagarla = cambiar ese fichero o revertir su commit. Los tres pasos llevan continue-on-error
# y su propio timeout-minutes: un fallo o un cuelgue de la sombra nunca pone el job en rojo ni toca lo ya publicado. El libro de contadores agregados
# (sin ISIN, símbolos, nombres ni precios) se guarda en la caché de Actions con una clave por run; se restaura la más reciente.
# Si la lista de Supabase no tiene nada que refrescar (ningún fondo con ficha de iShares ni símbolos) el job sale justo después de leerla, sin instalar nada.
on:
  schedule:
    - cron: '38 6,13,21 * * *'
  workflow_dispatch:

# Por defecto NADA. El único job pide solo lectura del repo.
permissions: {}

# Nunca dos runs a la vez: cada run publica el payload COMPLETO del usuario (la RPC lo sustituye), así que un run viejo que termine después de uno nuevo pisaría datos frescos con
# datos viejos. Grupo PROPIO, distinto del de NAV (ver arriba). `cancel-in-progress: false`: un run a medias nunca se mata a mitad de publicación.
concurrency:
  group: personal-full
  cancel-in-progress: false

jobs:
  personal-full:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.FEED_V2_ENABLED == 'true') }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip

      # Solo biblioteca estándar (`python3 -S`: sin site-packages, ningún paquete de terceros puede cargarse). Escribe work=true|false en $GITHUB_OUTPUT.
      - name: Read personal watch list (token, stdlib only)
        id: watch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
          PERSONAL_FEED_TOKEN: ${{ secrets.PERSONAL_FEED_TOKEN }}
        run: python3 -S scripts/personal_v2.py watch --dir "$RUNNER_TEMP/personal" --github-output

      # Solo lo fijado en requirements.txt (versiones exactas + hashes). Se omite (con el resto) si no hay nada que refrescar.
      - name: Install dependencies (hash-pinned)
        if: ${{ steps.watch.outputs.work == 'true' }}
        run: pip install --require-hashes --no-deps -r requirements.txt

      # Código de terceros (yfinance, requests...): NO recibe el token. Imprime solo contadores de frescura (ver personal_v2.py).
      - name: Build personal payloads (third-party code, NO token)
        if: ${{ steps.watch.outputs.work == 'true' }}
        run: python scripts/personal_v2.py build --dir "$RUNNER_TEMP/personal" --registry registry.json

      - name: Publish personal payloads (token, stdlib only)
        if: ${{ steps.watch.outputs.work == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
          PERSONAL_FEED_TOKEN: ${{ secrets.PERSONAL_FEED_TOKEN }}
        run: python3 -S scripts/personal_v2.py publish --dir "$RUNNER_TEMP/personal"

      # ---- SOMBRA NAV Yahoo (F1): solo mide, NO PUBLICA NADA. Ver la cabecera. Nunca rojo: continue-on-error + timeout por paso.
      - name: Yahoo shadow - restore aggregate counters (cache)
        if: ${{ !cancelled() && steps.watch.outputs.work == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/yahoo-shadow
          key: yahoo-shadow-ledger-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: yahoo-shadow-ledger-v1-

      # Código de terceros (yfinance), SIN token. Una búsqueda + un histórico (5d) por fondo y lectura, con la pausa y la parada ante 429 de la sonda.
      - name: Yahoo shadow - measure (third-party code, NO token, publishes nothing)
        id: shadow
        if: ${{ !cancelled() && steps.watch.outputs.work == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/yahoo_shadow.py --dir "$RUNNER_TEMP/personal" --config config/yahoo_shadow.json --ledger "$RUNNER_TEMP/yahoo-shadow/ledger.json"

      # Solo si este run hizo una lectura (ledger=written): fuera de franja o con la sombra apagada no se guarda nada.
      - name: Yahoo shadow - save aggregate counters (cache)
        if: ${{ !cancelled() && steps.shadow.outputs.ledger == 'written' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/yahoo-shadow
          key: yahoo-shadow-ledger-v1-${{ github.run_id }}-${{ github.run_attempt }}
