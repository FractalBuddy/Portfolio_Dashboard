name: Update market data

on:
  schedule:
    # 4x/day (UTC): 06:00, 11:00, 15:00, 20:00.
    - cron: '0 6,11,15,20 * * *'
  workflow_dispatch: {}   # manual run from the Actions tab

# Needed so the job can force-push the dedicated `data` branch (see "Publish" step).
permissions:
  contents: write

# Never let two runs overlap (a manual run during a scheduled one, or a slow run still
# going when the next cron fires): they'd race on the same branch. Queue instead of cancel
# so a half-finished run is never killed mid-publish.
concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # a hung Yahoo/FRED request can't burn Actions minutes forever
    steps:
      # Third-party actions are pinned to a full commit SHA (the tag in the comment is only
      # for humans). Dependabot (.github/dependabot.yml) opens a PR when a new one is out.
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_market_data.py

      # Refuse to publish anything that isn't a sane data.json: a run that "succeeds" but
      # produced an empty/partial file must never overwrite the last good data.
      - name: Sanity-check output
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import json, os
          d = json.load(open("data.json"))
          m = json.load(open("meta.json"))
          def with_hist(k):
              return sum(1 for x in d.get(k, []) if x.get("history"))
          assert len(d.get("indices", [])) >= 5, "too few indices"
          assert len(d.get("stocks", [])) >= 10, "too few stocks"
          assert with_hist("indices") >= 0.7 * len(d["indices"]), "most indices have no history (Yahoo throttled?)"
          assert with_hist("stocks") >= 0.7 * len(d["stocks"]), "most stocks have no history (Yahoo throttled?)"
          priced = sum(1 for x in d["stocks"] if x.get("price") is not None)
          assert priced >= 0.7 * len(d["stocks"]), "most stocks have no price (%d/%d)" % (priced, len(d["stocks"]))
          bm = d.get("benchmarks", {})
          assert len(bm.get("sp500", [])) >= 30, "benchmark S&P 500 too short"
          assert len(d.get("commodities", [])) >= 3 and len(d.get("forex", [])) >= 3, "commodities/forex too small"
          assert len(d.get("market_mood", {})) >= 1, "market mood empty"
          assert any(d.get("news", {}).get(k) for k in ("general", "positions")), "no news at all"
          assert len(d.get("your_funds", [])) >= 1, "your_funds empty"
          assert len(d.get("heatmap", [])) >= 10, "country heatmap too small"
          assert len(d.get("sector_heatmap", [])) >= 8, "sector heatmap too small"
          if os.environ.get("FRED_API_KEY"):
              assert len(d.get("rates", [])) >= 1, "FRED key set but no rates"
              assert len(d.get("cpi", [])) >= 12, "FRED key set but CPI series empty"
              import datetime as _dt
              _last = d["cpi"][-1]["date"]
              if (_dt.date.today() - _dt.date.fromisoformat(_last)).days > 120:
                  print("::warning::La serie de IPC termina en %s: el modo 'real' del dashboard usa ese último valor para fechas posteriores" % _last)
          assert m["generated_at"] == d["generated_at"], "meta/data mismatch"
          # jsDelivr no sirve ficheros de GitHub > 20 MB: fallar aquí evita publicar un feed que dejaría de servirse.
          assert m["data_bytes"] < 18_000_000, "data.json too large for jsDelivr (%s bytes)" % m["data_bytes"]
          print("OK:", len(d["indices"]), "indices,", len(d["stocks"]), "stocks,", m["data_bytes"], "bytes")
          PY

      # The feed lives on its OWN orphan branch (`data`) that is replaced by a single fresh
      # commit on every run, instead of adding a ~0.4MB commit to `main` 4x/day forever.
      # Result: the repo never grows (main = code only; `data` = always exactly 1 commit),
      # and there is nothing to `git pull --rebase` because nobody else ever pushes there
      # (and the concurrency group above already serialises runs).
      - name: Publish to data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir /tmp/publish
          cp data.json meta.json /tmp/publish/
          cd /tmp/publish
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json meta.json
          git commit -q -m "Market data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Purge jsDelivr CDN cache
        run: |
          # best-effort (jsDelivr cachea ramas ~12 h y el purge a veces falla): se imprime la respuesta para poder verlo en el log
          for f in data.json meta.json; do
            echo "purge $f:"
            curl -sS --max-time 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/${f}" || echo "(purge fallido, no es crítico)"
            echo
          done
