name: Update market data

on:
  schedule:
    # 4x/day (UTC): 06:17, 11:17, 15:17, 20:17 (minuto «feo» a propósito: los cron en :00 son los que más retrasa GitHub).
    - cron: '17 6,11,15,20 * * *'
  workflow_dispatch: {}   # manual run from the Actions tab

# Por defecto TODO solo lectura. Solo el job `publish` (que no instala ni ejecuta código de terceros) recibe contents: write.
permissions:
  contents: read

# Never let two runs overlap (a manual run during a scheduled one, or a slow run still
# going when the next cron fires): they'd race on the same branch. Queue instead of cancel
# so a half-finished run is never killed mid-publish.
concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  fetch:
    # Instala dependencias flotantes (yfinance...) y ejecuta código de terceros: por eso NO tiene permiso de escritura ni secretos salvo FRED.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # a hung Yahoo/FRED request can't burn Actions minutes forever
    steps:
      # Third-party actions are pinned to a full commit SHA (the tag in the comment is only
      # for humans). Dependabot (.github/dependabot.yml) opens a PR when a new one is out.
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_market_data.py

      # Refuse to publish anything that isn't a sane data.json: a run that "succeeds" but
      # produced an empty/partial file must never overwrite the last good data.
      - name: Sanity-check output
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import json, os
          d = json.load(open("data.json"))
          m = json.load(open("meta.json"))
          def with_hist(k):
              return sum(1 for x in d.get(k, []) if x.get("history"))
          assert len(d.get("indices", [])) >= 5, "too few indices"
          assert len(d.get("stocks", [])) >= 10, "too few stocks"
          assert with_hist("indices") >= 0.7 * len(d["indices"]), "most indices have no history (Yahoo throttled?)"
          assert with_hist("stocks") >= 0.7 * len(d["stocks"]), "most stocks have no history (Yahoo throttled?)"
          priced = sum(1 for x in d["stocks"] if x.get("price") is not None)
          assert priced >= 0.7 * len(d["stocks"]), "most stocks have no price (%d/%d)" % (priced, len(d["stocks"]))
          bm = d.get("benchmarks", {})
          assert len(bm.get("sp500", [])) >= 30, "benchmark S&P 500 too short"
          assert len(d.get("commodities", [])) >= 3 and len(d.get("forex", [])) >= 3, "commodities/forex too small"
          assert len(d.get("market_mood", {})) >= 1, "market mood empty"
          assert any(d.get("news", {}).get(k) for k in ("general", "positions")), "no news at all"
          assert len(d.get("your_funds", [])) >= 1, "your_funds empty"
          assert len(d.get("heatmap", [])) >= 10, "country heatmap too small"
          assert len(d.get("sector_heatmap", [])) >= 8, "sector heatmap too small"
          if os.environ.get("FRED_API_KEY"):
              assert len(d.get("rates", [])) >= 1, "FRED key set but no rates"
              assert len(d.get("cpi", [])) >= 12, "FRED key set but CPI series empty"
              import datetime as _dt
              _last = d["cpi"][-1]["date"]
              if (_dt.date.today() - _dt.date.fromisoformat(_last)).days > 120:
                  print("::warning::La serie de IPC termina en %s: el modo 'real' del dashboard usa ese último valor para fechas posteriores" % _last)
          # --- plausibilidad (auditoría 2026-10): Yahoo degradado/congelado no debe pisar el último feed bueno ---
          import datetime as _dt2
          _sp = next((x for x in d["indices"] if x.get("symbol") == "^GSPC"), None)
          assert _sp and _sp.get("history"), "^GSPC missing"
          assert (_dt2.date.today() - _dt2.date.fromisoformat(_sp["history"][-1]["date"])).days <= 6, "^GSPC history stale (Yahoo frozen?)"
          _bad = [x.get("symbol") for k in ("indices", "stocks", "commodities", "forex") for x in d.get(k, [])
                  if not (x.get("price") or 0) > 0 or abs(x.get("change_pct") or 0) > 60]
          assert len(_bad) <= 2, "implausible price/change: %s" % _bad[:5]
          assert len(d["stocks"]) >= 25 and len(d.get("funds", [])) >= 3, "universe shrank"
          assert all(str(n.get("link", "")).startswith(("http://", "https://")) for k in d.get("news", {}) for n in d["news"][k]), "non-http news link"
          assert m["generated_at"] == d["generated_at"], "meta/data mismatch"
          # jsDelivr no sirve ficheros de GitHub > 20 MB: fallar aquí evita publicar un feed que dejaría de servirse.
          assert m["data_bytes"] < 18_000_000, "data.json too large for jsDelivr (%s bytes)" % m["data_bytes"]
          print("OK:", len(d["indices"]), "indices,", len(d["stocks"]), "stocks,", m["data_bytes"], "bytes")
          PY

      - name: Upload feed artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: market-data
          path: |
            data.json
            meta.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: fetch
    # Único job con permiso de escritura. No hace pip install ni ejecuta scripts del repo: solo baja el artefacto ya validado y lo publica.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download feed artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: market-data

      # The feed lives on its OWN orphan branch (`data`) that is replaced by a single fresh
      # commit on every run, instead of adding a ~0.4MB commit to `main` 4x/day forever.
      # Result: the repo never grows (main = code only; `data` = always exactly 1 commit),
      # and there is nothing to `git pull --rebase` because nobody else ever pushes there
      # (and the concurrency group above already serialises runs).
      - name: Publish to data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir /tmp/publish
          cp data.json meta.json /tmp/publish/
          cd /tmp/publish
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json meta.json
          git commit -q -m "Market data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Purge jsDelivr CDN cache and verify
        run: |
          # best-effort: NO hace fallar el job (jsDelivr cachea ramas ~12 h y el purge a veces falla), pero comprueba que el CDN
          # sirve ya el meta.json nuevo y, si no, deja un ::warning:: visible en el resumen del run.
          set -u
          want=$(python3 -c 'import json;print(json.load(open("meta.json"))["generated_at"])')
          for f in data.json meta.json; do
            echo "purge $f:"
            curl -sS --max-time 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/${f}" || echo "(purge fallido, no es crítico)"
            echo
          done
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS --max-time 20 "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/meta.json?cb=$RANDOM" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("generated_at",""))' 2>/dev/null || true)
            if [ "$got" = "$want" ]; then echo "CDN sirve la versión nueva ($want)"; exit 0; fi
            echo "intento $i: CDN sirve '$got' (esperado '$want')"
            sleep $((i*20))
          done
          echo "::warning::jsDelivr sigue sirviendo un meta.json antiguo tras 6 intentos (la caché de rama puede tardar hasta ~12 h); el dashboard se pondrá al día solo."

  # Latido para Healthchecks.io: avisa si el workflow FALLA, se CANCELA, agota el timeout o deja de ejecutarse del todo
  # (cron desactivado, scheduler caído). La URL va en el secreto HC_UPDATE_URL (nunca en el repo, que es público).
  heartbeat:
    needs: [fetch, publish]
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ping Healthchecks.io
        env:
          HC: ${{ secrets.HC_UPDATE_URL }}
          FETCH: ${{ needs.fetch.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          [ -n "$HC" ] || exit 0
          HC="${HC%/}"
          if [ "$FETCH" = "success" ] && [ "$PUBLISH" = "success" ]; then url="$HC"; else url="$HC/fail"; fi
          curl -fsS -m 10 --retry 5 --retry-all-errors "$url" >/dev/null
