name: Update market datak

on:
  schedule:
    # Runs 4x/day (UTC). Adjust freely -- GitHub's minimum practical interval is ~5 min,
    # but frequent runs on a free/public repo are fine. Times below: 06:00, 11:00, 15:00, 20:00 UTC.
    - cron: '0 6,11,15,20 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit data.json back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_market_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update market data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Purge jsDelivr CDN cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data.json" || true
