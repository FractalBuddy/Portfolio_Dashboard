name: Generate reports

on:
  schedule:
    # Todos los días a las 06:20 UTC (08:20 en verano / 07:20 en invierno, hora de Madrid),
    # después de la primera actualización del feed de mercado (06:00 UTC).
    - cron: '20 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: generate-reports
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-reports.txt

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements-reports.txt
          playwright install --with-deps chromium

      - name: Generate reports
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          SYNC_PASSPHRASE: ${{ secrets.SYNC_PASSPHRASE }}
        run: python scripts/generate_reports.py
