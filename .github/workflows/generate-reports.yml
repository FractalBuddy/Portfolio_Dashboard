name: Generate reports

on:
  schedule:
    # Todos los días a las 06:20 UTC (08:20 en verano / 07:20 en invierno, hora de Madrid),
    # después de la primera actualización del feed de mercado (06:00 UTC).
    - cron: '20 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: generate-reports
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-reports.txt

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements-reports.txt
          playwright install --with-deps chromium

      - name: Generate reports
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          SYNC_PASSPHRASE: ${{ secrets.SYNC_PASSPHRASE }}
        run: python scripts/generate_reports.py
